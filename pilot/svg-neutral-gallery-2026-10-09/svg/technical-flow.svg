<?xml version='1.0' encoding='utf-8'?>
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="800" viewBox="0 0 1200 800" role="img" aria-labelledby="title desc">
  <title id="title">01 / Technical workflow</title>
  <desc id="desc">Swimlanes, decisions, revision loops and preservation boundaries</desc>
  <rect x="0" y="0" width="1200" height="800" fill="#0A1924" />
  <text x="36" y="52" fill="#FCFDF7" font-family="Arial, sans-serif" font-size="26">01 / Technical workflow</text>
  <text x="36" y="84" fill="#C38651" font-family="Arial, sans-serif" font-size="15">Swimlanes, decisions, revision loops and preservation boundaries</text>
  <defs>
    <symbol id="icon-source" viewBox="0 0 30 30">
      <path d="M5 3H15L21 9V25H5ZM15 3V9H21M9 14H17M9 19H17" fill="none" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" />
    </symbol>
    <symbol id="icon-palette" viewBox="0 0 30 30">
      <path d="M15 3C7 3 3 8 3 15S9 27 16 27C22 27 20 22 18 21C16 20 19 17 23 17C29 17 27 3 15 3ZM9 10H10M16 8H17M22 11H23M8 17H9" fill="none" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" />
    </symbol>
    <symbol id="icon-code" viewBox="0 0 30 30">
      <path d="M10 7L3 15L10 23M20 7L27 15L20 23M18 4L12 26" fill="none" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" />
    </symbol>
    <symbol id="icon-layers" viewBox="0 0 30 30">
      <path d="M15 3L28 10L15 17L2 10ZM3 16L15 23L27 16M3 22L15 29L27 22" fill="none" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" />
    </symbol>
    <symbol id="icon-terminal" viewBox="0 0 30 30">
      <path d="M3 5H27V25H3ZM7 10L12 15L7 20M16 20H23" fill="none" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" />
    </symbol>
    <symbol id="icon-document" viewBox="0 0 30 30">
      <path d="M7 3H23V27H7ZM11 9H19M11 14H19M11 19H17" fill="none" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" />
    </symbol>
    <symbol id="icon-check" viewBox="0 0 30 30">
      <path d="M15 2L26 6V16C26 23 15 28 15 28S4 23 4 16V6ZM9 14L13 18L21 10" fill="none" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" />
    </symbol>
    <symbol id="icon-archive" viewBox="0 0 30 30">
      <path d="M3 4H27V10H3ZM6 10V27H24V10M11 15H19M15 15V20" fill="none" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" />
    </symbol>
    <symbol id="icon-search" viewBox="0 0 30 30">
      <path d="M21 13A8 8 0 1 1 5 13A8 8 0 1 1 21 13M19 19L28 28" fill="none" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" />
    </symbol>
    <symbol id="icon-pin" viewBox="0 0 30 30">
      <path d="M15 2C4 2 3 13 8 19L15 28L22 19C27 13 26 2 15 2ZM19 11A4 4 0 1 1 11 11A4 4 0 1 1 19 11" fill="none" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" />
    </symbol>
    <symbol id="icon-network" viewBox="0 0 30 30">
      <path d="M12 3H18V9H12ZM2 21H8V27H2ZM22 21H28V27H22ZM5 21V15H25V21M15 9V15" fill="none" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" />
    </symbol>
    <symbol id="icon-image" viewBox="0 0 30 30">
      <path d="M3 4H27V26H3ZM3 22L11 13L17 20L22 15L27 22M22 9H23" fill="none" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" />
    </symbol>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M1 1L9 5L1 9Z" fill="#A66B35" />
    </marker>
  </defs>
  <g id="swimlanes" aria-label="Three workflow lanes">
    <rect x="36" y="120" width="1128" height="148" fill="#212C34" rx="12" />
    <text x="54" y="149" fill="#FCFDF7" font-family="Arial, sans-serif" font-size="14">SOURCE</text>
    <text x="54" y="176" fill="#C38651" font-family="Arial, sans-serif" font-size="12">Original bytes retained</text>
    <rect x="36" y="285" width="1128" height="148" fill="#212C34" rx="12" />
    <text x="54" y="314" fill="#FCFDF7" font-family="Arial, sans-serif" font-size="14">ENGINE</text>
    <text x="54" y="341" fill="#C38651" font-family="Arial, sans-serif" font-size="12">Canonical identity stays</text>
    <text x="54" y="361" fill="#C38651" font-family="Arial, sans-serif" font-size="12">separate</text>
    <rect x="36" y="450" width="1128" height="148" fill="#212C34" rx="12" />
    <text x="54" y="479" fill="#FCFDF7" font-family="Arial, sans-serif" font-size="14">REVIEW</text>
    <text x="54" y="506" fill="#C38651" font-family="Arial, sans-serif" font-size="12">Local artifacts before</text>
    <text x="54" y="526" fill="#C38651" font-family="Arial, sans-serif" font-size="12">application acceptance</text>
  </g>
  <g id="connectors" aria-label="Workflow connectors and revision loop">
    <path d="M490 170H512" stroke="#A66B35" fill="none" stroke-width="2" stroke-linejoin="round" marker-end="url(#arrow)" />
    <path d="M745 170H767" stroke="#A66B35" fill="none" stroke-width="2" stroke-linejoin="round" marker-end="url(#arrow)" />
    <path d="M490 335H512" stroke="#A66B35" fill="none" stroke-width="2" stroke-linejoin="round" marker-end="url(#arrow)" />
    <path d="M745 335H767" stroke="#A66B35" fill="none" stroke-width="2" stroke-linejoin="round" marker-end="url(#arrow)" />
    <path d="M490 500H512" stroke="#A66B35" fill="none" stroke-width="2" stroke-linejoin="round" marker-end="url(#arrow)" />
    <path d="M745 500H767" stroke="#A66B35" fill="none" stroke-width="2" stroke-linejoin="round" marker-end="url(#arrow)" />
    <path d="M1000 191H1096V277H356V309" stroke="#A66B35" fill="none" stroke-width="2" stroke-linejoin="round" marker-end="url(#arrow)" />
    <path d="M1000 356H1096V440H356V474" stroke="#A66B35" fill="none" stroke-width="2" stroke-linejoin="round" marker-end="url(#arrow)" />
    <path d="M1000 568V605H920V640" stroke="#A66B35" fill="none" stroke-width="2" stroke-linejoin="round" marker-end="url(#arrow)" />
    <path d="M601 568V623H601V670H326V568" stroke="#A66B35" fill="none" stroke-width="2" stroke-linejoin="round" stroke-dasharray="7 6" marker-end="url(#arrow)" />
    <text x="385" y="647" fill="#C38651" font-family="Arial, sans-serif" font-size="14">Revise semantic mapping; retain canonical colors</text>
  </g>
  <g id="workflow-nodes" aria-label="Nine workflow nodes">
    <rect x="260" y="144" width="230" height="94" fill="#18222A" rx="10" stroke="#F8C265" stroke-width="2" />
    <use href="#icon-image" x="276" y="162" width="30" height="30" stroke="#F8C265" fill="none" />
    <text x="318" y="180" fill="#FCFDF7" font-family="Arial, sans-serif" font-size="18">Artwork</text>
    <text x="276" y="216" fill="#C38651" font-family="Arial, sans-serif" font-size="13">TIFF / PNG / SVG source</text>
    <rect x="515" y="144" width="230" height="94" fill="#18222A" rx="10" stroke="#4A6E8D" stroke-width="2" />
    <use href="#icon-source" x="531" y="162" width="30" height="30" stroke="#4A6E8D" fill="none" />
    <text x="573" y="180" fill="#FCFDF7" font-family="Arial, sans-serif" font-size="18">Normalize</text>
    <text x="531" y="216" fill="#C38651" font-family="Arial, sans-serif" font-size="13">Orientation and color profile</text>
    <rect x="770" y="144" width="230" height="94" fill="#18222A" rx="10" stroke="#89B2A7" stroke-width="2" />
    <use href="#icon-archive" x="786" y="162" width="30" height="30" stroke="#89B2A7" fill="none" />
    <text x="828" y="180" fill="#FCFDF7" font-family="Arial, sans-serif" font-size="18">Provenance</text>
    <text x="786" y="216" fill="#C38651" font-family="Arial, sans-serif" font-size="13">Source hash and preserved bytes</text>
    <rect x="260" y="309" width="230" height="94" fill="#18222A" rx="10" stroke="#F8C265" stroke-width="2" />
    <use href="#icon-palette" x="276" y="327" width="30" height="30" stroke="#F8C265" fill="none" />
    <text x="318" y="345" fill="#FCFDF7" font-family="Arial, sans-serif" font-size="18">Canonical 32</text>
    <text x="276" y="381" fill="#C38651" font-family="Arial, sans-serif" font-size="13">Observed RGB values and IDs</text>
    <rect x="515" y="309" width="230" height="94" fill="#18222A" rx="10" stroke="#4A6E8D" stroke-width="2" />
    <use href="#icon-layers" x="531" y="327" width="30" height="30" stroke="#4A6E8D" fill="none" />
    <text x="573" y="345" fill="#FCFDF7" font-family="Arial, sans-serif" font-size="18">Semantic roles</text>
    <text x="531" y="381" fill="#C38651" font-family="Arial, sans-serif" font-size="13">Source references and findings</text>
    <rect x="770" y="309" width="230" height="94" fill="#18222A" rx="10" stroke="#89B2A7" stroke-width="2" />
    <use href="#icon-code" x="786" y="327" width="30" height="30" stroke="#89B2A7" fill="none" />
    <text x="828" y="345" fill="#FCFDF7" font-family="Arial, sans-serif" font-size="18">Target tokens</text>
    <text x="786" y="381" fill="#C38651" font-family="Arial, sans-serif" font-size="13">Dark adaptation; source hue</text>
    <rect x="260" y="474" width="230" height="94" fill="#18222A" rx="10" stroke="#F8C265" stroke-width="2" />
    <use href="#icon-document" x="276" y="492" width="30" height="30" stroke="#F8C265" fill="none" />
    <text x="318" y="510" fill="#FCFDF7" font-family="Arial, sans-serif" font-size="18">Native export</text>
    <text x="276" y="546" fill="#C38651" font-family="Arial, sans-serif" font-size="13">Target contract and artifacts</text>
    <rect x="515" y="474" width="230" height="94" fill="#18222A" rx="10" stroke="#4A6E8D" stroke-width="2" />
    <use href="#icon-check" x="531" y="492" width="30" height="30" stroke="#4A6E8D" fill="none" />
    <text x="573" y="510" fill="#FCFDF7" font-family="Arial, sans-serif" font-size="18">Local checks</text>
    <text x="531" y="546" fill="#C38651" font-family="Arial, sans-serif" font-size="13">Parsing, contrast and previews</text>
    <rect x="770" y="474" width="230" height="94" fill="#18222A" rx="10" stroke="#89B2A7" stroke-width="2" />
    <use href="#icon-search" x="786" y="492" width="30" height="30" stroke="#89B2A7" fill="none" />
    <text x="828" y="510" fill="#FCFDF7" font-family="Arial, sans-serif" font-size="18">Operator review</text>
    <text x="786" y="546" fill="#C38651" font-family="Arial, sans-serif" font-size="13">Application import is separate</text>
  </g>
  <g id="decision" aria-label="Review decision and preserved evidence">
    <path d="M920 640L962 677L920 714L878 677Z" stroke="#F8C265" fill="#18222A" stroke-width="2" stroke-linejoin="round" />
    <text x="920" y="682" fill="#FCFDF7" font-family="Arial, sans-serif" font-size="13" text-anchor="middle">Ready?</text>
    <path d="M962 677H1000" stroke="#A66B35" fill="none" stroke-width="2" stroke-linejoin="round" marker-end="url(#arrow)" />
    <text x="1008" y="669" fill="#FCFDF7" font-family="Arial, sans-serif" font-size="15">Record findings</text>
    <text x="1008" y="694" fill="#C38651" font-family="Arial, sans-serif" font-size="13">No auto activation</text>
    <text x="54" y="701" fill="#FCFDF7" font-family="Arial, sans-serif" font-size="16">All stages keep dated recovery evidence</text>
  </g>
  <line x1="36" y1="746" x2="1164" y2="746" stroke="#A66B35" stroke-width="1" />
  <text x="36" y="775" fill="#C38651" font-family="Arial, sans-serif" font-size="14">TECHNICAL / Architecture, runbooks and process documentation</text>
  <text x="1164" y="775" fill="#C38651" font-family="Arial, sans-serif" font-size="12" text-anchor="end">ILLUSTRATIVE / EDITABLE VECTOR</text>
</svg>