<?xml version='1.0' encoding='utf-8'?>
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="800" viewBox="0 0 1200 800" role="img" aria-labelledby="title desc">
  <title id="title">02 / Editorial infographic</title>
  <desc id="desc">Large typography, section hierarchy, reusable marks and layered composition</desc>
  <rect x="0" y="0" width="1200" height="800" fill="#0A1924" />
  <text x="36" y="52" fill="#FCFDF7" font-family="Arial, sans-serif" font-size="26">02 / Editorial infographic</text>
  <text x="36" y="84" fill="#C38651" font-family="Arial, sans-serif" font-size="15">Large typography, section hierarchy, reusable marks and layered composition</text>
  <defs>
    <symbol id="icon-source" viewBox="0 0 30 30">
      <path d="M5 3H15L21 9V25H5ZM15 3V9H21M9 14H17M9 19H17" fill="none" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" />
    </symbol>
    <symbol id="icon-palette" viewBox="0 0 30 30">
      <path d="M15 3C7 3 3 8 3 15S9 27 16 27C22 27 20 22 18 21C16 20 19 17 23 17C29 17 27 3 15 3ZM9 10H10M16 8H17M22 11H23M8 17H9" fill="none" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" />
    </symbol>
    <symbol id="icon-code" viewBox="0 0 30 30">
      <path d="M10 7L3 15L10 23M20 7L27 15L20 23M18 4L12 26" fill="none" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" />
    </symbol>
    <symbol id="icon-layers" viewBox="0 0 30 30">
      <path d="M15 3L28 10L15 17L2 10ZM3 16L15 23L27 16M3 22L15 29L27 22" fill="none" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" />
    </symbol>
