    <text x="60" y="318" fill="#F8C265" font-family="Arial, sans-serif" font-size="170">32</text>
    <text x="65" y="391" fill="#FCFDF7" font-family="Arial, sans-serif" font-size="28">observed colors</text>
    <rect x="65" y="424" width="27" height="24" fill="#F8C265" rx="4" />
