  <g id="editorial-sections" aria-label="Three editorial sections">
    <rect x="410" y="120" width="754" height="146" fill="#18222A" rx="12" />
    <text x="438" y="173" fill="#F8C265" font-family="Arial, sans-serif" font-size="38">01</text>
    <use href="#icon-source" x="1110" y="142" width="30" height="30" stroke="#F8C265" fill="none" />
    <text x="525" y="164" fill="#FCFDF7" font-family="Arial, sans-serif" font-size="27">Preserve</text>
    <text x="525" y="199" fill="#FCFDF7" font-family="Arial, sans-serif" font-size="18">Original artwork and provenance</text>
    <text x="525" y="234" fill="#C38651" font-family="Arial, sans-serif" font-size="15">Byte-preserved sources; dated evidence.</text>
    <line x1="438" y1="252" x2="1136" y2="252" stroke="#F8C265" stroke-width="2" />
    <rect x="410" y="286" width="754" height="146" fill="#18222A" rx="12" />
    <text x="438" y="339" fill="#4A6E8D" font-family="Arial, sans-serif" font-size="38">02</text>
    <use href="#icon-layers" x="1110" y="308" width="30" height="30" stroke="#4A6E8D" fill="none" />
    <text x="525" y="330" fill="#FCFDF7" font-family="Arial, sans-serif" font-size="27">Interpret</text>
    <text x="525" y="365" fill="#FCFDF7" font-family="Arial, sans-serif" font-size="18">Meaning references the palette</text>
    <text x="525" y="400" fill="#C38651" font-family="Arial, sans-serif" font-size="15">Semantic assignments remain separate.</text>
    <line x1="438" y1="418" x2="1136" y2="418" stroke="#4A6E8D" stroke-width="2" />
    <rect x="410" y="452" width="754" height="146" fill="#18222A" rx="12" />
    <text x="438" y="505" fill="#89B2A7" font-family="Arial, sans-serif" font-size="38">03</text>
    <use href="#icon-code" x="1110" y="474" width="30" height="30" stroke="#89B2A7" fill="none" />
    <text x="525" y="496" fill="#FCFDF7" font-family="Arial, sans-serif" font-size="27">Adapt</text>
    <text x="525" y="531" fill="#FCFDF7" font-family="Arial, sans-serif" font-size="18">Readable dark application surfaces</text>
    <text x="525" y="566" fill="#C38651" font-family="Arial, sans-serif" font-size="15">Lightness and chroma may vary; hue stays.</text>
    <line x1="438" y1="584" x2="1136" y2="584" stroke="#89B2A7" stroke-width="2" />
  </g>
  <g id="editorial-notes" aria-label="Supporting editorial callouts">
    <rect x="410" y="638" width="238" height="68" fill="#212C34" rx="9" />
    <text x="426" y="679" fill="#FCFDF7" font-family="Arial, sans-serif" font-size="29">10</text>
    <text x="475" y="678" fill="#C38651" font-family="Arial, sans-serif" font-size="13">existing target formats</text>
    <rect x="668" y="638" width="238" height="68" fill="#212C34" rx="9" />
    <text x="684" y="679" fill="#FCFDF7" font-family="Arial, sans-serif" font-size="29">3</text>
    <text x="733" y="678" fill="#C38651" font-family="Arial, sans-serif" font-size="13">separate artifact layers</text>
    <rect x="926" y="638" width="238" height="68" fill="#212C34" rx="9" />
    <text x="942" y="679" fill="#FCFDF7" font-family="Arial, sans-serif" font-size="29">0</text>
    <text x="991" y="678" fill="#C38651" font-family="Arial, sans-serif" font-size="13">automatic installations</text>
  </g>
  <line x1="36" y1="746" x2="1164" y2="746" stroke="#A66B35" stroke-width="1" />
  <text x="36" y="775" fill="#C38651" font-family="Arial, sans-serif" font-size="14">EDITORIAL / Explainers, posters and presentation figures</text>
  <text x="1164" y="775" fill="#C38651" font-family="Arial, sans-serif" font-size="12" text-anchor="end">ILLUSTRATIVE / EDITABLE VECTOR</text>
</svg>