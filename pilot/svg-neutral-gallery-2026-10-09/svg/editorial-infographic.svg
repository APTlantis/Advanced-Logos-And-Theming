    <text x="65" y="579" fill="#C38651" font-family="Arial, sans-serif" font-size="14">32 cells / conceptual palette</text>
    <text x="65" y="623" fill="#FCFDF7" font-family="Arial, sans-serif" font-size="19">Identity before adaptation</text>
    <text x="65" y="652" fill="#C38651" font-family="Arial, sans-serif" font-size="14">Actual RGB values: palette.toml</text>
    <text x="65" y="675" fill="#C38651" font-family="Arial, sans-serif" font-size="13">Tiles repeat the six mark tokens</text>
