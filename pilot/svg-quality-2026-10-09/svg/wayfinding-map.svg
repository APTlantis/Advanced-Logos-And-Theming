    <rect x="36" y="120" width="820" height="586" rx="14" fill="url(#map-grid)" />
    <path d="M70 280H820" stroke="#212C34" fill="none" stroke-width="32" stroke-linejoin="round" stroke-linecap="round" />
    <path d="M70 280H820" stroke="#A66B35" fill="none" stroke-width="1" stroke-linejoin="round" stroke-dasharray="5 8" />
    <path d="M70 480H820" stroke="#212C34" fill="none" stroke-width="32" stroke-linejoin="round" stroke-linecap="round" />
    <path d="M70 480H820" stroke="#A66B35" fill="none" stroke-width="1" stroke-linejoin="round" stroke-dasharray="5 8" />
    <path d="M320 150V675" stroke="#212C34" fill="none" stroke-width="32" stroke-linejoin="round" stroke-linecap="round" />
    <path d="M320 150V675" stroke="#A66B35" fill="none" stroke-width="1" stroke-linejoin="round" stroke-dasharray="5 8" />
    <path d="M600 150V675" stroke="#212C34" fill="none" stroke-width="32" stroke-linejoin="round" stroke-linecap="round" />
    <path d="M600 150V675" stroke="#A66B35" fill="none" stroke-width="1" stroke-linejoin="round" stroke-dasharray="5 8" />
    <rect x="90" y="160" width="155" height="80" fill="#212C34" rx="8" stroke="#F8C265" stroke-width="2" />
    <use href="#icon-document" x="105" y="173" width="25" height="25" stroke="#FCFDF7" fill="none" />
    <text x="105" y="221" fill="#FCFDF7" font-family="Arial, sans-serif" font-size="17">Library</text>
    <rect x="375" y="160" width="150" height="80" fill="#212C34" rx="8" stroke="#4A6E8D" stroke-width="2" />
    <use href="#icon-image" x="390" y="173" width="25" height="25" stroke="#FCFDF7" fill="none" />
    <text x="390" y="221" fill="#FCFDF7" font-family="Arial, sans-serif" font-size="17">Studio</text>
    <rect x="655" y="160" width="145" height="80" fill="#212C34" rx="8" stroke="#89B2A7" stroke-width="2" />
    <use href="#icon-archive" x="670" y="173" width="25" height="25" stroke="#FCFDF7" fill="none" />
    <text x="670" y="221" fill="#FCFDF7" font-family="Arial, sans-serif" font-size="17">Archive</text>
    <rect x="90" y="340" width="155" height="94" fill="#212C34" rx="8" stroke="#4A6E8D" stroke-width="2" />
    <use href="#icon-code" x="105" y="353" width="25" height="25" stroke="#FCFDF7" fill="none" />
    <text x="105" y="415" fill="#FCFDF7" font-family="Arial, sans-serif" font-size="17">Workshop</text>
    <rect x="375" y="340" width="150" height="94" fill="#212C34" rx="8" stroke="#FDEFB4" stroke-width="2" />
    <use href="#icon-palette" x="390" y="353" width="25" height="25" stroke="#FCFDF7" fill="none" />
    <text x="390" y="415" fill="#FCFDF7" font-family="Arial, sans-serif" font-size="17">Gallery</text>
    <rect x="655" y="340" width="145" height="94" fill="#212C34" rx="8" stroke="#EDAF57" stroke-width="2" />
    <use href="#icon-check" x="670" y="353" width="25" height="25" stroke="#FCFDF7" fill="none" />
    <text x="670" y="415" fill="#FCFDF7" font-family="Arial, sans-serif" font-size="17">Review</text>
    <rect x="90" y="540" width="155" height="100" fill="#212C34" rx="8" stroke="#F8C265" stroke-width="2" />
    <use href="#icon-source" x="105" y="553" width="25" height="25" stroke="#FCFDF7" fill="none" />
    <text x="105" y="621" fill="#FCFDF7" font-family="Arial, sans-serif" font-size="17">Intake</text>
    <rect x="655" y="540" width="145" height="100" fill="#212C34" rx="8" stroke="#4A6E8D" stroke-width="2" />
    <use href="#icon-network" x="670" y="553" width="25" height="25" stroke="#FCFDF7" fill="none" />
    <text x="670" y="621" fill="#FCFDF7" font-family="Arial, sans-serif" font-size="17">Commons</text>
    <path d="M390 544Q460 520 525 563L515 635Q450 666 390 630Z" stroke="#89B2A7" fill="#18222A" stroke-width="2" stroke-linejoin="round" stroke-dasharray="4 5" />
    <circle cx="410" cy="574" r="8" fill="#89B2A7" />
    <circle cx="474" cy="560" r="8" fill="#89B2A7" />
    <circle cx="488" cy="614" r="8" fill="#89B2A7" />
    <circle cx="421" cy="627" r="8" fill="#89B2A7" />
    <text x="406" y="605" fill="#FCFDF7" font-family="Arial, sans-serif" font-size="16">Garden</text>
  </g>
  <g id="routes" aria-label="Two labeled illustrative routes">
    <path d="M167 640V675H320V280H730V240" stroke="#F8C265" fill="none" stroke-width="5" stroke-linejoin="round" stroke-linecap="round" />
    <path d="M170 434V480H600V280H450V240" stroke="#89B2A7" fill="none" stroke-width="4" stroke-linejoin="round" stroke-dasharray="10 7" />
    <circle cx="320" cy="650" r="13" fill="#18222A" stroke="#F8C265" stroke-width="2" />
    <text x="320" y="655" fill="#FCFDF7" font-family="Arial, sans-serif" font-size="13" text-anchor="middle">1</text>
    <circle cx="320" cy="480" r="13" fill="#18222A" stroke="#F8C265" stroke-width="2" />
    <text x="320" y="485" fill="#FCFDF7" font-family="Arial, sans-serif" font-size="13" text-anchor="middle">2</text>
    <circle cx="320" cy="280" r="13" fill="#18222A" stroke="#F8C265" stroke-width="2" />
    <text x="320" y="285" fill="#FCFDF7" font-family="Arial, sans-serif" font-size="13" text-anchor="middle">3</text>
    <circle cx="600" cy="280" r="13" fill="#18222A" stroke="#F8C265" stroke-width="2" />
    <text x="600" y="285" fill="#FCFDF7" font-family="Arial, sans-serif" font-size="13" text-anchor="middle">4</text>
    <circle cx="730" cy="280" r="13" fill="#18222A" stroke="#F8C265" stroke-width="2" />
    <text x="730" y="285" fill="#FCFDF7" font-family="Arial, sans-serif" font-size="13" text-anchor="middle">5</text>
    <use href="#icon-pin" x="142" y="648" width="28" height="28" stroke="#F8C265" fill="none" />
    <text x="74" y="691" fill="#FCFDF7" font-family="Arial, sans-serif" font-size="12">START</text>
  </g>
  <g id="map-key" aria-label="Map legend and orientation">
    <rect x="880" y="120" width="284" height="586" fill="#212C34" rx="14" />
    <text x="904" y="165" fill="#FCFDF7" font-family="Arial, sans-serif" font-size="18">MAP KEY</text>
    <line x1="907" y1="208" x2="951" y2="208" stroke="#F8C265" stroke-width="5" />
    <text x="966" y="213" fill="#FCFDF7" font-family="Arial, sans-serif" font-size="16">Archive route</text>
    <line x1="907" y1="252" x2="951" y2="252" stroke="#89B2A7" stroke-width="4" stroke-dasharray="10 7" />
    <text x="966" y="257" fill="#FCFDF7" font-family="Arial, sans-serif" font-size="16">Studio route</text>
    <use href="#icon-pin" x="907" y="287" width="28" height="28" stroke="#FCFDF7" fill="none" />
    <text x="966" y="310" fill="#FCFDF7" font-family="Arial, sans-serif" font-size="16">Entry point</text>
    <circle cx="921" cy="352" r="11" fill="#18222A" stroke="#F8C265" stroke-width="2" />
    <text x="966" y="357" fill="#FCFDF7" font-family="Arial, sans-serif" font-size="16">Route step</text>
    <line x1="1022" y1="520" x2="1022" y2="450" stroke="#F8C265" stroke-width="3" marker-end="url(#arrow)" />
    <text x="1022" y="432" fill="#FCFDF7" font-family="Arial, sans-serif" font-size="20" text-anchor="middle">N</text>
    <text x="904" y="581" fill="#FCFDF7" font-family="Arial, sans-serif" font-size="18">Conceptual layout</text>
    <text x="904" y="610" fill="#C38651" font-family="Arial, sans-serif" font-size="14">Positions are illustrative.</text>
    <text x="904" y="637" fill="#C38651" font-family="Arial, sans-serif" font-size="14">No distances or live routing.</text>
    <text x="904" y="680" fill="#C38651" font-family="Arial, sans-serif" font-size="12">NOT TO SCALE</text>
  </g>
  <line x1="36" y1="746" x2="1164" y2="746" stroke="#A66B35" stroke-width="1" />
  <text x="36" y="775" fill="#C38651" font-family="Arial, sans-serif" font-size="14">WAYFINDING / Campus guides, floor plans and schematic maps</text>
  <text x="1164" y="775" fill="#C38651" font-family="Arial, sans-serif" font-size="12" text-anchor="end">ILLUSTRATIVE / EDITABLE VECTOR</text>
</svg>