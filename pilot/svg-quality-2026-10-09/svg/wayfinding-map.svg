<?xml version='1.0' encoding='utf-8'?>
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="800" viewBox="0 0 1200 800" role="img" aria-labelledby="title desc">
  <title id="title">05 / Wayfinding map</title>
  <desc id="desc">Illustrative campus • paths, blocks, route markers, landmarks and a map key</desc>
  <rect x="0" y="0" width="1200" height="800" fill="#0A1924" />
  <text x="36" y="52" fill="#FCFDF7" font-family="Arial, sans-serif" font-size="26">05 / Wayfinding map</text>
  <text x="36" y="84" fill="#C38651" font-family="Arial, sans-serif" font-size="15">Illustrative campus • paths, blocks, route markers, landmarks and a map key</text>
  <defs>
    <symbol id="icon-source" viewBox="0 0 30 30">
      <path d="M5 3H15L21 9V25H5ZM15 3V9H21M9 14H17M9 19H17" fill="none" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" />
    </symbol>
    <symbol id="icon-palette" viewBox="0 0 30 30">
      <path d="M15 3C7 3 3 8 3 15S9 27 16 27C22 27 20 22 18 21C16 20 19 17 23 17C29 17 27 3 15 3ZM9 10H10M16 8H17M22 11H23M8 17H9" fill="none" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" />
    </symbol>
    <symbol id="icon-code" viewBox="0 0 30 30">
      <path d="M10 7L3 15L10 23M20 7L27 15L20 23M18 4L12 26" fill="none" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" />
    </symbol>
    <symbol id="icon-layers" viewBox="0 0 30 30">
      <path d="M15 3L28 10L15 17L2 10ZM3 16L15 23L27 16M3 22L15 29L27 22" fill="none" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" />
    </symbol>
    <symbol id="icon-terminal" viewBox="0 0 30 30">
      <path d="M3 5H27V25H3ZM7 10L12 15L7 20M16 20H23" fill="none" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" />
    </symbol>
    <symbol id="icon-document" viewBox="0 0 30 30">
      <path d="M7 3H23V27H7ZM11 9H19M11 14H19M11 19H17" fill="none" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" />
    </symbol>
    <symbol id="icon-check" viewBox="0 0 30 30">
      <path d="M15 2L26 6V16C26 23 15 28 15 28S4 23 4 16V6ZM9 14L13 18L21 10" fill="none" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" />
    </symbol>
    <symbol id="icon-archive" viewBox="0 0 30 30">
      <path d="M3 4H27V10H3ZM6 10V27H24V10M11 15H19M15 15V20" fill="none" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" />
    </symbol>
    <symbol id="icon-search" viewBox="0 0 30 30">
      <path d="M21 13A8 8 0 1 1 5 13A8 8 0 1 1 21 13M19 19L28 28" fill="none" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" />
    </symbol>
    <symbol id="icon-pin" viewBox="0 0 30 30">
      <path d="M15 2C4 2 3 13 8 19L15 28L22 19C27 13 26 2 15 2ZM19 11A4 4 0 1 1 11 11A4 4 0 1 1 19 11" fill="none" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" />
    </symbol>
    <symbol id="icon-network" viewBox="0 0 30 30">
      <path d="M12 3H18V9H12ZM2 21H8V27H2ZM22 21H28V27H22ZM5 21V15H25V21M15 9V15" fill="none" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" />
    </symbol>
    <symbol id="icon-image" viewBox="0 0 30 30">
      <path d="M3 4H27V26H3ZM3 22L11 13L17 20L22 15L27 22M22 9H23" fill="none" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" />
    </symbol>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M1 1L9 5L1 9Z" fill="#A66B35" />
    </marker>
    <pattern id="map-grid" width="28" height="28" patternUnits="userSpaceOnUse">
      <path d="M28 0H0V28" fill="none" stroke="#A66B35" opacity=".18" stroke-width="1" />
    </pattern>
  </defs>
