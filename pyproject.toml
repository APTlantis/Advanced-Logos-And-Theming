[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "aptlantis-theme-pipeline"
version = "0.1.0"
description = "Image-derived dark palettes and native application themes"
requires-python = ">=3.12"
dependencies = ["numpy>=2,<3", "scikit-learn>=1.6,<2", "coloraide>=8,<9", "Pillow>=11,<13"]

[project.scripts]
apt-theme = "apt_theme.cli:main"

[tool.setuptools.packages.find]
include = ["apt_theme*"]

[tool.setuptools.package-data]
apt_theme = ["*.mjs"]
