services:

  # Caddy reverse proxy
  caddy:
    image: caddy:latest
    container_name: caddy-aptlantis
    restart: unless-stopped
    ports:
      - "127.0.0.1:8100:8100"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - A:/aptlantis.net/dist:/srv/aptlantis.net:ro
      - caddy_data:/data
      - caddy_config:/config
    networks:
      - aptlantis-network

networks:
  aptlantis-network:
    driver: bridge

volumes:
  caddy_data:
  caddy_config:
